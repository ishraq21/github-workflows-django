name: Release

# Pushing a version tag such as v0.1.0 runs the full CI first,
# then publishes the Docker image to GitHub Container Registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the Docker image
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the image
        run: |
          # Registry names must be lowercase, and usernames often aren't.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --tag "$image:$GITHUB_REF_NAME" .
          docker push "$image:$GITHUB_REF_NAME"
